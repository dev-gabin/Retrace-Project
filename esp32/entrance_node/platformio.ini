; Retrace - 출입 노드 (스마트 현관등)
; 보드: LOLIN D32 (ESP32)

[env:lolin_d32]
platform = espressif32@7.1.3
board = lolin_d32
framework = arduino
monitor_speed = 115200

; 네트워크 코드까지 링크하는 PC 빌드 검증용. 실제 업로드는 lolin_d32 환경 사용.
[env:lolin_d32_network_check]
extends = env:lolin_d32
build_flags = -D RETRACE_NETWORK_BUILD_CHECK
